name: Update rates

on:
  schedule:
    - cron: "15 13 * * 1-5"   # weekdays 9:15 AM EDT / 8:15 AM EST (after FRED's morning update)
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Send a test alert email"
        type: boolean
        default: false
      backfill:
        description: "Rebuild chart history from FRED"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["docs/**", "config.json", "scripts/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch rates, news, send alert
        run: python scripts/update.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          TEST_ALERT: ${{ inputs.test_alert }}
          BACKFILL: ${{ inputs.backfill }}

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data state.json
          git diff --staged --quiet || git commit -m "Rates $(TZ=America/New_York date +%F)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
